<style>
  :root { --ink:#111; --paper:#fff; --bg:#f3f2ee; --muted:#666; --soft:#e7e5df; --r:18px; --b:2.5px solid var(--ink); }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Nunito','M PLUS Rounded 1c', system-ui, sans-serif; color:var(--ink); background:var(--bg); font-weight:600; }
  button, input, select { font:inherit; color:inherit; }
  button { cursor:pointer; }
  a { color:inherit; }
  .wrap { max-width:1280px; margin:0 auto; padding:24px 24px 40px; }

  header { display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-bottom:22px; }
  .logo { background:var(--ink); color:#fff; border-radius:40px; padding:6px 30px; font-size:30px; font-weight:900; letter-spacing:1px; }
  header p { margin:0; font-size:17px; color:var(--muted); font-weight:700; flex:1; min-width:240px; }
  .uilang { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:800; }

  .layout { display:grid; grid-template-columns:370px 1fr; gap:26px; align-items:start; }
  @media (max-width:920px) { .layout { grid-template-columns:1fr; } .panel { position:static !important; } }

  .card { background:var(--paper); border:var(--b); border-radius:var(--r); padding:20px 22px; }
  .panel { position:sticky; top:16px; }
  .step { display:flex; align-items:center; gap:10px; font-size:19px; font-weight:800; margin:0 0 10px; }
  .n { width:28px; height:28px; border-radius:50%; background:var(--ink); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:15px; font-weight:900; flex:none; }
  .block + .block { margin-top:22px; }

  .levels { display:flex; flex-direction:column; gap:8px; }
  .level { display:flex; gap:12px; align-items:center; border:var(--b); border-radius:14px; padding:10px 14px; background:#fff; text-align:left; width:100%; }
  .level:hover { background:var(--soft); }
  .level[aria-checked="true"] { background:var(--ink); color:#fff; }
  .level .big { font-size:26px; font-weight:900; width:24px; text-align:center; flex:none; }
  .level b { display:block; font-size:17px; font-weight:900; }
  .level small { display:block; font-size:13.5px; font-weight:700; opacity:.75; line-height:1.3; }

  .seedrow { display:flex; gap:8px; align-items:stretch; }
  .nav { width:46px; border:var(--b); border-radius:12px; background:#fff; font-size:22px; font-weight:900; flex:none; }
  .nav:hover { background:var(--soft); }
  .input { flex:1; min-width:0; height:50px; border:var(--b); border-radius:12px; padding:0 12px; font-size:22px; font-weight:900; background:#fff; text-align:center; }
  .input:focus, .btn:focus-visible, .level:focus-visible, .chip:focus-visible, .nav:focus-visible, .select:focus { outline:3px solid #111; outline-offset:2px; }
  .hint { margin:8px 0 0; font-size:13.5px; color:var(--muted); font-weight:700; line-height:1.4; }

  .langs { display:grid; grid-template-columns:auto 1fr; gap:8px 10px; align-items:center; font-size:15px; font-weight:800; }
  .select { height:42px; border:var(--b); border-radius:12px; background:#fff; padding:0 10px; font-size:16px; font-weight:800; min-width:0; }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:var(--b); border-radius:12px; background:#fff; padding:8px 14px; font-size:15px; font-weight:800; text-decoration:none; text-align:center; }
  .btn:hover { background:var(--soft); }
  .btn.dark { background:var(--ink); color:#fff; }
  .btn.dark:hover { background:#333; }
  .btn:disabled { opacity:.5; cursor:default; }
  .wide { width:100%; margin-top:8px; }
  .big-btn { min-height:54px; font-size:18px; font-weight:900; border-radius:14px; }
  .printrow { display:flex; flex-direction:column; gap:8px; }

  .recent { display:flex; flex-wrap:wrap; gap:6px; }
  .picks { display:flex; flex-direction:column; gap:6px; }
  .pick { display:flex; align-items:center; gap:10px; border:2px solid var(--ink); border-radius:12px; padding:6px 10px; background:#fff; font-size:14.5px; font-weight:800; text-align:left; width:100%; }
  .pick:hover { background:var(--soft); }
  .pick .tickbox { width:22px; height:22px; border:2.5px solid var(--ink); border-radius:6px; display:inline-flex; align-items:center; justify-content:center; flex:none; font-size:15px; color:#fff; }
  .pick[aria-checked="true"] .tickbox { background:var(--ink); }
  .pick .no { font-weight:900; min-width:18px; }
  .chip { border:2px solid var(--ink); border-radius:20px; padding:3px 12px; background:#fff; font-size:14px; font-weight:800; }
  .chip:hover { background:var(--soft); }
  .chip[aria-pressed="true"] { background:var(--ink); color:#fff; }

  .bar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .bar h2 { margin:0 auto 0 0; font-size:24px; font-weight:900; }
  .pages { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:20px; }
  .pages.single { grid-template-columns:minmax(300px, 560px); }
  .pg { position:relative; aspect-ratio:794/1123; background:#fff; border:2px solid var(--ink); border-radius:8px; overflow:hidden; }
  .pg iframe { position:absolute; left:0; top:0; width:794px; height:1123px; border:0; transform-origin:0 0; pointer-events:none; }
  .pno { margin:0 0 6px; font-size:14px; font-weight:800; color:var(--muted); }

  .loading { border:2.5px dashed #999; border-radius:var(--r); padding:60px 20px; text-align:center; color:var(--muted); font-size:17px; font-weight:700; }
  .spinner { width:34px; height:34px; border:4px solid #ccc; border-top-color:var(--ink); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 14px; }
  @keyframes spin { to { transform:rotate(360deg); } }

  footer { margin-top:34px; color:var(--muted); font-size:14px; font-weight:700; line-height:1.6; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff; border-radius:14px; padding:12px 20px; font-size:15px; font-weight:800; max-width:min(640px,90vw); z-index:50; }
  #printframe { position:fixed; right:0; bottom:0; width:794px; height:10px; border:0; opacity:0; pointer-events:none; }
</style>

<body>
<div class="wrap">
  <header>
    <div class="logo">LET'S PRACTICE!</div>
    <p data-t="tagline"></p>
    <label class="uilang"><span data-t="uiLang"></span><select class="select" id="ui-lang"></select></label>
  </header>

  <div class="layout">
    <aside class="card panel">
      <div class="block">
        <p class="step"><span class="n">1</span><span data-t="level"></span></p>
        <div class="levels" role="radiogroup" id="levels"></div>
      </div>

      <div class="block">
        <p class="step"><span class="n">2</span><label for="seed" data-t="number"></label></p>
        <div class="seedrow">
          <button class="nav" id="prev" type="button">‹</button>
          <input class="input" id="seed" type="number" min="0" max="999999" inputmode="numeric">
          <button class="nav" id="next" type="button">›</button>
        </div>
        <button class="btn wide" id="random" type="button" data-t="random"></button>
        <p class="hint" data-t="numberHint"></p>
      </div>

      <div class="block">
        <p class="step"><span class="n">3</span><span data-t="languages"></span></p>
        <div class="langs">
          <label for="lang" data-t="sheetLang"></label><select class="select" id="lang"></select>
          <label for="alang" data-t="answersLang"></label><select class="select" id="alang"></select>
        </div>
      </div>

      <div class="block">
        <p class="step"><span class="n">4</span><span data-t="print"></span></p>
        <div class="printrow">
          <button class="btn dark big-btn" id="print-sheet" type="button" disabled data-t="printSheet"></button>
          <button class="btn big-btn" id="print-answers" type="button" disabled data-t="printAnswers"></button>
          <button class="btn dark" id="pdf-sheet" type="button" hidden data-t="pdfSheet"></button>
          <button class="btn" id="pdf-answers" type="button" hidden data-t="pdfAnswers"></button>
          <button class="btn" id="copy-link" type="button" data-t="copyLink"></button>
        </div>
        <p class="hint" data-t="printHint"></p>
      </div>

      <div class="block" id="cheat-block" hidden>
        <p class="step"><span class="n">5</span><span data-t="cheats"></span></p>
        <p class="hint" style="margin:0 0 10px" data-t="cheatsHint"></p>
        <div class="picks" id="cheat-picks" role="group"></div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn" id="cheat-all" type="button" data-t="all"></button>
          <button class="btn" id="cheat-none" type="button" data-t="none"></button>
        </div>
        <button class="btn dark big-btn wide" id="print-cheats" type="button" disabled data-t="printCheats"></button>
      </div>

      <div class="block" id="recent-block" hidden>
        <p class="step" data-t="recent"></p>
        <div class="recent" id="recent"></div>
      </div>
    </aside>

    <main>
      <div class="bar">
        <h2 id="title"></h2>
        <div class="recent" id="tabs">
          <button class="chip" data-tab="sheet" aria-pressed="true" data-t="tabSheet"></button>
          <button class="chip" data-tab="answers" aria-pressed="false" data-t="tabAnswers"></button>
          <button class="chip" data-tab="cheats" aria-pressed="false" id="tab-cheats" hidden data-t="tabCheats"></button>
        </div>
      </div>
      <div id="view"><div class="loading"><div class="spinner"></div><span data-t="loading"></span></div></div>
    </main>
  </div>

  <footer>
    <span data-t="footer"></span><br>
    <span data-t="privacy"></span>
    <span data-t="source"></span>: <a href="https://github.com/ISergey256/lets-practice-worksheets">github.com/ISergey256/lets-practice-worksheets</a>
  </footer>
</div>
<iframe id="printframe" title="print" aria-hidden="true" tabindex="-1"></iframe>

/* ================================================================ state */
const PYODIDE = "https://cdn.jsdelivr.net/pyodide/v314.0.8/full/";
const MAX_SEED = 999999;
const FONT_CSS = new URL("fonts/fonts.css", location.href).href;
// A4 is 793.7 × 1122.5 px; the sheet is drawn at 794 × 1123, so trim one pixel when printing to avoid an empty extra page
const PRINT_CSS = "@page{size:A4;margin:0}html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}" +
                  "@media print{.page{width:793px;height:1122px;break-after:page}.page:last-child{break-after:auto}}";
const $ = (id) => document.getElementById(id);
// "R" = Reception, "Y1A" = Year 1 autumn (icon-led sheets), 1 / 2 / 3 = Year 1 review by difficulty
const LEVEL_IDS = ["R", "Y1A", 1, 2, 3];
const parseLevel = (v) => (v === "R" || v === "Y1A" ? v : [1, 2, 3].includes(+v) ? +v : null);
const isStage = (v) => typeof v === "string";
const levelTag = (v) => (isStage(v) ? v : `L${v}`);
const pick = (v, d) => (v in LANGS ? v : d);
const state = {
  level: 2, seed: 101, tab: "sheet", sheet: null, ready: false,
  ui: pick(localStorage.ui, "en"), lang: pick(localStorage.lang, "en"), alang: pick(localStorage.alang, "en"),
};
let backend = null;  // {build(level, seed, lang, alang) -> {pages, answers, css}, pdf?}

const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);
const t = (k, o) => fmt(UI[state.ui][k], o || {});

/* ================================================================ url: #L2-123 or #L2-123-uk-ru */
function readHash() {
  const m = location.hash.match(/^#(L[123]|R|Y1A)-(\d{1,6})(?:-([a-z]{2})-([a-z]{2}))?$/);
  if (!m) return false;
  state.level = parseLevel(m[1].replace(/^L/, "")); state.seed = +m[2];
  if (m[3]) { state.lang = pick(m[3], "en"); state.alang = pick(m[4], "en"); }
  return true;
}
function writeHash() {
  const langs = state.lang === "en" && state.alang === "en" ? "" : `-${state.lang}-${state.alang}`;
  history.replaceState(null, "", `#${levelTag(state.level)}-${state.seed}${langs}`);
}
const randomSeed = () => 100 + Math.floor(Math.random() * 9900);

/* ================================================================ backends */
// 1) local server (scripts/server.py): builds with Python on this computer and can make real PDF files
async function localBackend() {
  const r = await fetch("api/info", { cache: "no-store" });
  if (!r.ok) throw new Error("no local server");
  await r.json();
  return {
    pdf: true,
    async build(level, seed, lang, alang) {
      const q = new URLSearchParams({ level, seed, lang, alang });
      const res = await fetch(`api/build?${q}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.status);
      return data;
    },
    async cheats(level, seed, lang, which) {
      const q = new URLSearchParams({ level, seed, lang, which: which.join(",") });
      const res = await fetch(`api/cheats?${q}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.status);
      return data;
    },
  };
}
// 2) GitHub Pages: the same Python generator runs in the browser (Pyodide = CPython compiled to WebAssembly)
async function pyodideBackend() {
  await new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = PYODIDE + "pyodide.js"; s.onload = ok; s.onerror = () => fail(new Error("pyodide.js"));
    document.head.appendChild(s);
  });
  const py = await loadPyodide({ indexURL: PYODIDE });
  py.FS.mkdirTree("/app");
  for (const f of ["generate.py", "i18n.py", "stages.py", "cheats.py"]) {
    py.FS.writeFile(`/app/${f}`, await (await fetch(f, { cache: "no-cache" })).text());
  }
  py.runPython("import sys, json; sys.path.insert(0, '/app'); import generate as g");
  const css = py.runPython("g.CSS");
  return {
    pdf: false,
    async build(level, seed, lang, alang) {
      py.globals.set("_a", py.toPy([level, seed, lang, alang]));
      const [pages, answers] = JSON.parse(py.runPython("json.dumps(g.build(*_a))"));
      return { pages, answers, css };
    },
    async cheats(level, seed, lang, which) {
      py.globals.set("_c", py.toPy([level, seed, lang, which]));
      const data = JSON.parse(py.runPython(
        "json.dumps({'pages': g.cheats(_c[0], _c[1], _c[2], list(_c[3])), 'titles': g.cheat_titles(_c[0], _c[2])})"));
      return { ...data, css };
    },
  };
}

/* ================================================================ rendering */
const doc = (bodies, css, title, lang) => `<!doctype html><html lang="${lang}"><head><meta charset="utf-8"><title>${title}</title>` +
  `<link rel="stylesheet" href="${FONT_CSS}"><style>${css}${PRINT_CSS}</style></head><body>${bodies.join("")}</body></html>`;
const stem = () => `Worksheet_${levelTag(state.level)}_${state.seed}_${state.lang}`;

function translateUI() {
  document.documentElement.lang = state.ui;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  $("prev").setAttribute("aria-label", t("prev")); $("next").setAttribute("aria-label", t("next"));
  $("levels").setAttribute("aria-label", t("level"));
  renderLevels(); renderTitle(); renderRecent();
  if (state.sheet) renderView();
}
function fillLangSelects() {
  for (const [id, key] of [["ui-lang", "ui"], ["lang", "lang"], ["alang", "alang"]]) {
    $(id).innerHTML = Object.entries(LANGS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
    $(id).value = state[key];
    $(id).onchange = () => {
      state[key] = $(id).value; localStorage[key] = state[key];
      if (key === "ui") translateUI(); else update();
    };
  }
}
function renderLevels() {
  const card = (id, big, name, text) => `
    <button type="button" class="level" role="radio" aria-checked="${id === state.level}" data-level="${id}" tabindex="${id === state.level ? 0 : -1}">
      <span class="big">${big}</span><span><b>${name}</b><small>${text}</small></span>
    </button>`;
  const u = UI[state.ui];
  $("levels").innerHTML = card("R", "R", ...u.stages.R) + card("Y1A", "Y1", ...u.stages.Y1A) +
    `<p class="hint" style="margin:6px 0 0">${u.review}</p>` +
    u.levels.map(([name, text], i) => card(i + 1, i + 1, name, text)).join("");
}
function setLevel(v) { state.level = v; localStorage.level = v; renderLevels(); update(); $("levels").querySelector(`[data-level="${v}"]`).focus(); }
$("levels").addEventListener("click", (e) => { const b = e.target.closest(".level"); if (b) setLevel(parseLevel(b.dataset.level)); });
$("levels").addEventListener("keydown", (e) => {
  const d = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[e.key];
  if (d) { e.preventDefault(); const i = LEVEL_IDS.indexOf(state.level); setLevel(LEVEL_IDS[(i + d + LEVEL_IDS.length) % LEVEL_IDS.length]); }
});

function setSeed(s) { state.seed = Math.min(MAX_SEED, Math.max(0, s)); $("seed").value = state.seed; update(); }
$("prev").onclick = () => setSeed(state.seed - 1);
$("next").onclick = () => setSeed(state.seed + 1);
$("random").onclick = () => setSeed(randomSeed());
let typing;
$("seed").addEventListener("input", () => {
  clearTimeout(typing);
  typing = setTimeout(() => { const v = $("seed").value.trim(); if (/^\d{1,6}$/.test(v)) { state.seed = +v; update(); } }, 300);
});
$("seed").addEventListener("blur", () => { $("seed").value = state.seed; });
$("tabs").addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (b) { state.tab = b.dataset.tab; renderView(); } });

function renderTitle() {
  const stage = isStage(state.level) ? UI[state.ui].stages[state.level][0] : null;
  const title = stage ? t("stageTitle", { stage, seed: state.seed }) : t("title", state);
  $("title").textContent = title;
  document.title = stage ? `${title} — LET'S PRACTICE!` : t("docTitle", state);
}

let buildNo = 0;
async function update() {
  writeHash();
  $("seed").value = state.seed;
  ["lang", "alang"].forEach((k) => { $(k).value = state[k]; });
  renderTitle();
  if (!backend) return;
  const no = ++buildNo;
  try {
    const sheet = await backend.build(state.level, state.seed, state.lang, state.alang);
    if (no !== buildNo) return;  // a newer request has started meanwhile
    state.sheet = sheet;
  } catch (err) {
    console.error(err);
    $("view").innerHTML = `<div class="loading"></div>`;
    $("view").firstChild.textContent = `${t("buildFail")} ${String(err.message || err).split("\n").slice(-2).join(" ")}`;
    return;
  }
  ["print-sheet", "print-answers", "pdf-sheet", "pdf-answers", "print-cheats"].forEach((id) => { $(id).disabled = false; });
  remember();
  await refreshCheats();
  renderView();
}

/* ================================================================ cheat sheets (stages R and Y1A only) */
const cheatTitles = {};  // "R-en" -> titles of the cards in the worksheet language
const picksFor = {};     // level -> Set of ticked task numbers (all by default)
const picks = () => picksFor[state.level] || (picksFor[state.level] = new Set(
  (cheatTitles[`${state.level}-${state.lang}`] || []).map((_, i) => i + 1)));
async function refreshCheats() {
  const on = isStage(state.level);
  $("cheat-block").hidden = $("tab-cheats").hidden = !on;
  if (!on) { if (state.tab === "cheats") state.tab = "sheet"; return; }
  const key = `${state.level}-${state.lang}`;
  if (!cheatTitles[key]) cheatTitles[key] = (await backend.cheats(state.level, state.seed, state.lang, [1])).titles;
  renderPicks();
}
function renderPicks() {
  const titles = cheatTitles[`${state.level}-${state.lang}`] || [], sel = picks();
  $("cheat-picks").innerHTML = titles.map((title, i) => `
    <button type="button" class="pick" role="checkbox" aria-checked="${sel.has(i + 1)}" data-pick="${i + 1}">
      <span class="tickbox">${sel.has(i + 1) ? "✓" : ""}</span><span class="no">${i + 1}</span><span>${title}</span></button>`).join("");
}
$("cheat-picks").addEventListener("click", (e) => {
  const b = e.target.closest("[data-pick]"); if (!b) return;
  const n = +b.dataset.pick, sel = picks();
  sel.has(n) ? sel.delete(n) : sel.add(n);
  renderPicks(); if (state.tab === "cheats") renderView();
});
$("cheat-all").onclick = () => { delete picksFor[state.level]; picks(); renderPicks(); if (state.tab === "cheats") renderView(); };
$("cheat-none").onclick = () => { picksFor[state.level] = new Set(); renderPicks(); if (state.tab === "cheats") renderView(); };
async function cheatPages() {
  const which = [...picks()].sort((a, b) => a - b);
  if (!which.length) return null;
  return (await backend.cheats(state.level, state.seed, state.lang, which)).pages;
}
$("print-cheats").onclick = async () => {
  const pages = await cheatPages();
  if (!pages) return toast(t("cheatsNone"));
  printBodies(pages, `${stem()}_cheats`, state.lang);
};

const scalers = new ResizeObserver((entries) => {
  for (const e of entries) e.target.firstElementChild.style.transform = `scale(${e.contentRect.width / 794})`;
});
let viewNo = 0;
async function renderView() {
  if (!state.sheet) return;
  $("tabs").querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.tab === state.tab));
  const no = ++viewNo;
  if (state.tab === "cheats") {
    const pages = await cheatPages();
    if (no !== viewNo) return;
    if (!pages) { $("view").innerHTML = `<div class="loading"></div>`; $("view").firstChild.textContent = t("cheatsNone"); return; }
    return showPages(pages, (i) => t("page", { n: i + 1 }), state.lang);
  }
  const isSheet = state.tab === "sheet";
  showPages(isSheet ? state.sheet.pages : [state.sheet.answers],
            (i) => (isSheet ? t("page", { n: i + 1 }) : t("answersFor")), isSheet ? state.lang : state.alang);
}
function showPages(bodies, labelOf, lang) {
  const wrap = document.createElement("div");
  wrap.className = "pages" + (bodies.length === 1 ? " single" : "");
  bodies.forEach((body, i) => {
    const cell = document.createElement("div");
    const label = document.createElement("p"); label.className = "pno";
    label.textContent = labelOf(i);
    const pg = document.createElement("div"); pg.className = "pg";
    const fr = document.createElement("iframe"); fr.title = label.textContent; fr.loading = "lazy";
    fr.srcdoc = doc([body], state.sheet.css, stem(), lang);
    pg.appendChild(fr); cell.append(label, pg); wrap.appendChild(cell);
  });
  scalers.disconnect();
  $("view").replaceChildren(wrap);
  wrap.querySelectorAll(".pg").forEach((p) => scalers.observe(p));
}

/* ================================================================ print, pdf, link */
async function printBodies(bodies, title, lang) {
  const f = $("printframe");
  await new Promise((ok) => { f.onload = ok; f.srcdoc = doc(bodies, state.sheet.css, title, lang); });
  await f.contentDocument.fonts.ready;
  const old = document.title; document.title = title;  // some browsers name the PDF after the top page
  f.contentWindow.focus(); f.contentWindow.print();
  setTimeout(() => { document.title = old; }, 1000);
}
$("print-sheet").onclick = () => printBodies(state.sheet.pages, stem(), state.lang);
$("print-answers").onclick = () => printBodies([state.sheet.answers], `${stem()}_answers_${state.alang}`, state.alang);

async function downloadPdf(which) {
  toast(t("making"));
  try {
    const r = await fetch("api/pdf", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ level: state.level, seed: state.seed, lang: state.lang, alang: state.alang }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    const a = document.createElement("a");
    a.href = `out/${encodeURIComponent(data[which])}?download=1`; a.download = data[which];
    document.body.appendChild(a); a.click(); a.remove();
    document.querySelector(".toast")?.remove();
  } catch (err) { console.error(err); toast(t("pdfFail")); }
}
$("pdf-sheet").onclick = () => downloadPdf("pdf");
$("pdf-answers").onclick = () => downloadPdf("answers_pdf");
$("copy-link").onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); toast(t("copied")); } catch { toast(location.href); }
};

/* ================================================================ recent */
function recentList() { try { return JSON.parse(localStorage.recent2 || "[]"); } catch { return []; } }
function remember() {
  const cur = [state.level, state.seed, state.lang, state.alang];
  const list = [cur, ...recentList().filter((x) => x.join() !== cur.join())].slice(0, 10);
  localStorage.recent2 = JSON.stringify(list);
  renderRecent();
}
function renderRecent() {
  const list = recentList(), cur = [state.level, state.seed, state.lang, state.alang].join();
  $("recent-block").hidden = list.length < 2;
  $("recent").innerHTML = list.map((x) => {
    const langs = x[2] === "en" && x[3] === "en" ? "" : ` · ${x[2]}/${x[3]}`;
    const lv = parseLevel(x[0]);
    const label = isStage(lv) ? `${lv === "Y1A" ? "Y1" : lv} · ${x[1]}` : t("short", { level: x[0], seed: x[1] });
    return `<button class="chip" data-r="${x.join()}" aria-pressed="${x.join() === cur}">${label}${langs}</button>`;
  }).join("");
}
$("recent").addEventListener("click", (e) => {
  const b = e.target.closest("[data-r]"); if (!b) return;
  const [l, s, lang, alang] = b.dataset.r.split(",");
  Object.assign(state, { level: parseLevel(l) || 2, lang: pick(lang, "en"), alang: pick(alang, "en") });
  renderLevels(); setSeed(+s);
});

let toastTimer;
function toast(msg) {
  document.querySelector(".toast")?.remove(); clearTimeout(toastTimer);
  const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = msg;
  document.body.appendChild(el); toastTimer = setTimeout(() => el.remove(), 3500);
}

/* ================================================================ start */
window.addEventListener("hashchange", () => { if (readHash()) { renderLevels(); update(); } });
if (!readHash()) { state.level = parseLevel(localStorage.level) || "Y1A"; state.seed = randomSeed(); }
fillLangSelects(); translateUI(); update();
localBackend().catch(() => pyodideBackend()).then((b) => {
  backend = b;
  $("pdf-sheet").hidden = $("pdf-answers").hidden = !b.pdf;
  update();
}).catch((err) => {
  console.error(err);
  $("view").innerHTML = `<div class="loading"></div>`;
  $("view").firstChild.textContent = t("loadFail");
});
</script>
</body>
</html>
