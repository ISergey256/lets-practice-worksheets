<style>

  [hidden] { display:none !important; }
  body { margin:0; font-family:'Nunito','M PLUS Rounded 1c', system-ui, sans-serif; color:var(--ink); background:var(--bg); font-weight:600; }
  button, input, select { font:inherit; color:inherit; }
  button { cursor:pointer; }
  a { color:inherit; }
  .wrap { max-width:1280px; margin:0 auto; padding:24px 24px 40px; }

  header { display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-bottom:22px; }
  .logo { background:var(--ink); color:#fff; border-radius:40px; padding:6px 30px; font-size:30px; font-weight:900; letter-spacing:1px; }
  header p { margin:0; font-size:17px; color:var(--muted); font-weight:700; flex:1; min-width:240px; }
  .uilang { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:800; }

  .layout { display:grid; grid-template-columns:370px 1fr; gap:26px; align-items:start; }
  @media (max-width:920px) { .layout { grid-template-columns:1fr; } .panel { position:static !important; } }

  .card { background:var(--paper); border:var(--b); border-radius:var(--r); padding:20px 22px; }
  .panel { position:sticky; top:16px; }
  .step { display:flex; align-items:center; gap:10px; font-size:19px; font-weight:800; margin:0 0 10px; }
  .n { width:28px; height:28px; border-radius:50%; background:var(--ink); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:15px; font-weight:900; flex:none; }
  .block + .block { margin-top:22px; }

  .levels { display:flex; flex-direction:column; gap:8px; }
  .level { display:flex; gap:12px; align-items:center; border:var(--b); border-radius:14px; padding:10px 14px; background:#fff; text-align:left; width:100%; }
  .level:hover { background:var(--soft); }
  .level[aria-checked="true"] { background:var(--ink); color:#fff; }
  .level .big { font-size:26px; font-weight:900; width:24px; text-align:center; flex:none; }
  .level b { display:block; font-size:17px; font-weight:900; }
  .level small { display:block; font-size:13.5px; font-weight:700; opacity:.75; line-height:1.3; }

  .seedrow { display:flex; gap:8px; align-items:stretch; }
  .nav { width:46px; border:var(--b); border-radius:12px; background:#fff; font-size:22px; font-weight:900; flex:none; }
  .nav:hover { background:var(--soft); }
  .input { flex:1; min-width:0; height:50px; border:var(--b); border-radius:12px; padding:0 12px; font-size:22px; font-weight:900; background:#fff; text-align:center; }
  .input:focus, .btn:focus-visible, .level:focus-visible, .chip:focus-visible, .nav:focus-visible, .select:focus { outline:3px solid #111; outline-offset:2px; }
  .hint { margin:8px 0 0; font-size:13.5px; color:var(--muted); font-weight:700; line-height:1.4; }

  .langs { display:grid; grid-template-columns:auto 1fr; gap:8px 10px; align-items:center; font-size:15px; font-weight:800; }
  .select { height:42px; border:var(--b); border-radius:12px; background:#fff; padding:0 10px; font-size:16px; font-weight:800; min-width:0; }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:var(--b); border-radius:12px; background:#fff; padding:8px 14px; font-size:15px; font-weight:800; text-decoration:none; text-align:center; }
  .btn:hover { background:var(--soft); }
  .btn.dark { background:var(--ink); color:#fff; }
  .btn.dark:hover { background:#333; }
  .btn:disabled { opacity:.5; cursor:default; }
  .wide { width:100%; margin-top:8px; }
  .big-btn { min-height:54px; font-size:18px; font-weight:900; border-radius:14px; }
  .printrow { display:flex; flex-direction:column; gap:8px; }

  .recent { display:flex; flex-wrap:wrap; gap:6px; }
  .picks { display:flex; flex-direction:column; gap:6px; }
  .chip:disabled { opacity:.45; cursor:default; background:#fff; }
  .strand { margin:12px 0 6px; font-size:13px; font-weight:900; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); }
  .trow { display:flex; flex-direction:column; gap:4px; margin-bottom:6px; }
  .ptag { margin-left:auto; flex:none; font-size:11.5px; font-weight:800; border:1.5px solid var(--ink); border-radius:10px; padding:0 7px; white-space:nowrap; }
  .vchips { display:flex; gap:5px; padding-left:42px; flex-wrap:wrap; }
  .vchips .chip { font-size:12.5px; padding:1px 9px; }
  .pick { display:flex; align-items:center; gap:10px; border:2px solid var(--ink); border-radius:12px; padding:6px 10px; background:#fff; font-size:14.5px; font-weight:800; text-align:left; width:100%; }
  .pick:hover { background:var(--soft); }
  .pick .tickbox { width:22px; height:22px; border:2.5px solid var(--ink); border-radius:6px; display:inline-flex; align-items:center; justify-content:center; flex:none; font-size:15px; color:#fff; }
  .pick[aria-checked="true"] .tickbox { background:var(--ink); }
  .pick .no { font-weight:900; min-width:18px; }
  .chip { border:2px solid var(--ink); border-radius:20px; padding:3px 12px; background:#fff; font-size:14px; font-weight:800; }
  .chip:hover { background:var(--soft); }
  .chip[aria-pressed="true"] { background:var(--ink); color:#fff; }

  .bar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .bar h2 { margin:0 auto 0 0; font-size:24px; font-weight:900; }
  .pages { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:20px; }
  .pages.single { grid-template-columns:minmax(300px, 560px); }
  .pg { position:relative; aspect-ratio:794/1123; background:#fff; border:2px solid var(--ink); border-radius:8px; overflow:hidden; }
  .pg iframe { position:absolute; left:0; top:0; width:794px; height:1123px; border:0; transform-origin:0 0; pointer-events:none; }
  .pno { margin:0 0 6px; font-size:14px; font-weight:800; color:var(--muted); }

  .loading { border:2.5px dashed #999; border-radius:var(--r); padding:60px 20px; text-align:center; color:var(--muted); font-size:17px; font-weight:700; }
  .spinner { width:34px; height:34px; border:4px solid #ccc; border-top-color:var(--ink); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 14px; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .about { border:var(--b); border-radius:var(--r); background:#fff; padding:16px 20px; margin-bottom:16px; color:var(--ink); }
  .about b { font-size:18px; font-weight:900; }
  .about p { margin:6px 0 0; font-size:15px; font-weight:700; line-height:1.5; }
  footer { margin-top:34px; color:var(--muted); font-size:14px; font-weight:700; line-height:1.6; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff; border-radius:14px; padding:12px 20px; font-size:15px; font-weight:800; max-width:min(640px,90vw); z-index:50; }
  .tools { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:-6px 0 14px; }
  .listen { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .listen .chip { display:inline-flex; align-items:center; gap:5px; }
  .listen .chip svg { width:18px; height:18px; }
  .tools .lab2 { font-size:14px; font-weight:800; color:var(--muted); }
  .harder { margin-left:auto; }
  /* touch screens: every control at least 44 px (STANDARDS A2) */
  @media (pointer:coarse) {
    .chip, .pick, .btn, .select, .nav { min-height:44px; }
    .vchips .chip { font-size:14px; padding:4px 14px; min-width:44px; }
    .pick .tickbox { width:28px; height:28px; }
  }
  #printframe { position:fixed; right:0; bottom:0; width:794px; height:10px; border:0; opacity:0; pointer-events:none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Let's Practice!</div>
    <p data-t="tagline"></p>
    <label class="uilang"><span data-t="uiLang"></span><select class="select" id="ui-lang"></select></label>
  </header>

  <div class="layout">
    <aside class="card panel">
      <div class="block">
        <p class="step"><span class="n">1</span><span data-t="year"></span></p>
        <div class="levels" role="radiogroup" id="years"></div>
      </div>

      <div class="block">
        <p class="step"><span class="n">2</span><span data-t="subject"></span></p>
        <div class="recent" id="subjects"></div>
      </div>

      <div class="block">
        <p class="step"><span class="n">3</span><span data-t="practise"></span></p>
        <div class="recent" id="modes" role="radiogroup"></div>
        <div class="levels" id="presets" role="radiogroup" style="margin-top:10px"></div>
        <div id="topic-picker" hidden style="margin-top:10px">
          <p class="hint" style="margin:0" data-t="topicsHint"></p>
          <p class="hint" style="margin:4px 0 8px;font-weight:900;color:var(--ink)" id="topic-count"></p>
          <div id="topic-list"></div>
        </div>
      </div>

      <div class="block">
        <p class="step"><span class="n">4</span><label for="seed" data-t="number"></label></p>
        <div class="seedrow">
          <button class="nav" id="prev" type="button">‹</button>
          <input class="input" id="seed" type="number" min="0" max="999999" inputmode="numeric">
          <button class="nav" id="next" type="button">›</button>
        </div>
        <button class="btn wide" id="random" type="button" data-t="random"></button>
        <p class="hint" data-t="numberHint"></p>
      </div>

      <div class="block">
        <p class="step"><span class="n">5</span><span data-t="languages"></span></p>
        <div class="langs">
          <label for="lang" data-t="sheetLang"></label><select class="select" id="lang"></select>
          <label for="alang" data-t="answersLang"></label><select class="select" id="alang"></select>
        </div>
      </div>

      <div class="block">
        <p class="step"><span class="n">6</span><span data-t="print"></span></p>
        <div class="printrow">
          <button class="btn dark big-btn" id="print-sheet" type="button" disabled data-t="printSheet"></button>
          <button class="btn big-btn" id="print-answers" type="button" disabled data-t="printAnswers"></button>
          <button class="btn dark" id="pdf-sheet" type="button" hidden data-t="pdfSheet"></button>
          <button class="btn" id="pdf-answers" type="button" hidden data-t="pdfAnswers"></button>
          <button class="btn" id="copy-link" type="button" data-t="copyLink"></button>
        </div>
        <p class="hint" data-t="printHint"></p>
      </div>

      <div class="block" id="cheat-block" hidden>
        <p class="step"><span class="n">7</span><span data-t="cheats"></span></p>
        <p class="hint" style="margin:0 0 10px" data-t="cheatsHint"></p>
        <div class="picks" id="cheat-picks" role="group"></div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn" id="cheat-all" type="button" data-t="all"></button>
          <button class="btn" id="cheat-none" type="button" data-t="none"></button>
        </div>
        <button class="btn dark big-btn wide" id="print-cheats" type="button" disabled data-t="printCheats"></button>
      </div>

      <div class="block">
        <p class="step" data-t="helpTitle"></p>
        <div class="printrow">
          <a class="btn" id="suggest" target="_blank" rel="noopener" data-t="suggest"></a>
          <a class="btn" id="report" target="_blank" rel="noopener" data-t="report"></a>
        </div>
        <p class="hint" data-t="ghNote"></p>
      </div>

      <div class="block" id="recent-block" hidden>
        <p class="step" data-t="recent"></p>
        <div class="recent" id="recent"></div>
      </div>
    </aside>

    <main>
      <div class="bar">
        <h2 id="title"></h2>
        <div class="recent" id="tabs">
          <button class="chip" data-tab="sheet" aria-pressed="true" data-t="tabSheet"></button>
          <button class="chip" data-tab="answers" aria-pressed="false" data-t="tabAnswers"></button>
          <button class="chip" data-tab="cheats" aria-pressed="false" id="tab-cheats" hidden data-t="tabCheats"></button>
        </div>
      </div>
      <div class="tools" id="tools" hidden>
        <div class="listen" id="listen" hidden><span class="lab2" data-t="listen"></span><span id="listen-btns" class="listen"></span></div>
        <button class="chip" id="cream" type="button" aria-pressed="false" data-t="cream"></button>
        <button class="btn dark harder" id="harder" type="button" hidden></button>
      </div>
      <div id="view"><div class="loading"><div class="spinner"></div><span data-t="loading"></span></div></div>
    </main>
  </div>

  <footer>
    <div class="about" id="thanks" hidden>
      <b data-t="thanksTitle"></b>
      <p id="thanks-list"></p>
      <p><a href="https://github.com/ISergey256/lets-practice-worksheets/blob/main/CONTRIBUTORS.md" data-t="joinUs"></a></p>
    </div>
    <div class="about">
      <b data-t="aboutTitle"></b>
      <p data-t="about1"></p>
      <p data-t="about2"></p>
    </div>
    <span data-t="privacy"></span>
    <span data-t="source"></span>: <a href="https://github.com/ISergey256/lets-practice-worksheets">github.com/ISergey256/lets-practice-worksheets</a><br>
    <b data-t="free"></b>
    <a href="https://github.com/ISergey256/lets-practice-worksheets/blob/main/LICENSE.md" data-t="license"></a> ·
    <a id="why-link" data-t="why"></a>
  </footer>
</div>
<iframe id="printframe" title="print" aria-hidden="true" tabindex="-1"></iframe>

/* ================================================================ state */
const PYODIDE = "https://cdn.jsdelivr.net/pyodide/v314.0.8/full/";
const MAX_SEED = 999999;
const FONT_CSS = new URL("fonts/fonts.css", location.href).href;
// A4 is 793.7 × 1122.5 px; the sheet is drawn at 794 × 1123, so trim one pixel when printing to avoid an empty extra page
const PRINT_CSS = "@page{size:A4;margin:0}html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}" +
                  "@media print{.page{width:793px;height:1122px;break-after:page}.page:last-child{break-after:auto}}";
const $ = (id) => document.getElementById(id);
// level: "R" = Reception, "Y1A" = Year 1 autumn, 1 / 2 / 3 = Year 1 review by difficulty,
// "T:r1_v4a" = a sheet of chosen topics (scripts/topics.py)
const isTopics = (v) => typeof v === "string" && v.startsWith("T:");
const parseLevel = (v) => (v === "R" || v === "Y1A" || isTopics(v) ? v : [1, 2, 3].includes(+v) ? +v : null);
const isStage = (v) => typeof v === "string";
const levelTag = (v) => (isTopics(v) ? `T-${v.slice(2)}` : isStage(v) ? v : `L${v}`);
const yearOfLevel = (v) => (v === "R" ? "R" : isTopics(v) ? (topicYear(v.slice(2).split("_")[0]) || "Y1") : "Y1");
const pick = (v, d) => (v in LANGS ? v : d);
const state = {
  level: 2, seed: 101, tab: "sheet", sheet: null, ready: false,
  year: "Y1", mode: "ready", sel: {}, lastPreset: {},
  ui: pick(localStorage.ui, "en"), lang: pick(localStorage.lang, "en"), alang: pick(localStorage.alang, "en"),
};
let backend = null;  // {build(level, seed, lang, alang) -> {pages, answers, css}, pdf?}

const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);
const t = (k, o) => fmt(UI[state.ui][k], o || {});

/* ================================================================ url: #L2-123 or #L2-123-uk-ru */
function readHash() {
  const m = location.hash.match(/^#(L[123]|R|Y1A|T-[a-z0-9_]+)-(\d{1,6})(?:-([a-z]{2})-([a-z]{2}))?$/);
  if (!m) return false;
  state.level = parseLevel(m[1].startsWith("T-") ? `T:${m[1].slice(2)}` : m[1].replace(/^L/, "")); state.seed = +m[2];
  if (m[3]) { state.lang = pick(m[3], "en"); state.alang = pick(m[4], "en"); }
  return true;
}
function writeHash() {
  if (state.level === null) return;
  const langs = state.lang === "en" && state.alang === "en" ? "" : `-${state.lang}-${state.alang}`;
  history.replaceState(null, "", `#${levelTag(state.level)}-${state.seed}${langs}`);
  if (typeof updateFeedbackLinks === "function") updateFeedbackLinks();
}
const randomSeed = () => 100 + Math.floor(Math.random() * 9900);

/* ================================================================ backends */
// 1) local server (scripts/server.py): builds with Python on this computer and can make real PDF files
async function localBackend() {
  const r = await fetch("api/info", { cache: "no-store" });
  if (!r.ok) throw new Error("no local server");
  await r.json();
  return {
    pdf: true,
    async build(level, seed, lang, alang) {
      const q = new URLSearchParams({ level, seed, lang, alang });
      const res = await fetch(`api/build?${q}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.status);
      return data;
    },
    async catalog(lang) {
      const res = await fetch(`api/topics?lang=${lang}`);
      return res.json();
    },
    async cheatTitles(level, lang) {
      const res = await fetch(`api/cheat_titles?${new URLSearchParams({ level, lang })}`);
      return (await res.json()).titles;
    },
    async cheats(level, seed, lang, which) {
      const q = new URLSearchParams({ level, seed, lang, which: which.join(",") });
      const res = await fetch(`api/cheats?${q}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.status);
      return data;
    },
  };
}
// 2) GitHub Pages: the same Python generator runs in the browser (Pyodide = CPython compiled to WebAssembly)
async function pyodideBackend() {
  await new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = PYODIDE + "pyodide.js"; s.onload = ok; s.onerror = () => fail(new Error("pyodide.js"));
    document.head.appendChild(s);
  });
  const py = await loadPyodide({ indexURL: PYODIDE });
  py.FS.mkdirTree("/app");
  for (const f of ["generate.py", "i18n.py", "stages.py", "cheats.py", "topics.py", "topic_heights.json"]) {
    py.FS.writeFile(`/app/${f}`, await (await fetch(f, { cache: "no-cache" })).text());
  }
  py.runPython("import sys, json; sys.path.insert(0, '/app'); import generate as g, topics");
  const css = py.runPython("g.CSS");
  return {
    pdf: false,
    async build(level, seed, lang, alang) {
      py.globals.set("_a", py.toPy([level, seed, lang, alang]));
      const [pages, answers] = JSON.parse(py.runPython("json.dumps(g.build(*_a))"));
      return { pages, answers, css };
    },
    async catalog(lang) {
      py.globals.set("_l", lang);
      return JSON.parse(py.runPython("json.dumps(topics.catalog(_l))"));
    },
    async cheatTitles(level, lang) {
      py.globals.set("_t", py.toPy([level, lang]));
      return JSON.parse(py.runPython("json.dumps(g.cheat_titles(_t[0], _t[1]))"));
    },
    async cheats(level, seed, lang, which) {
      py.globals.set("_c", py.toPy([level, seed, lang, which]));
      const data = JSON.parse(py.runPython(
        "json.dumps({'pages': g.cheats(_c[0], _c[1], _c[2], list(_c[3])), 'titles': g.cheat_titles(_c[0], _c[2])})"));
      return { ...data, css };
    },
  };
}

/* ================================================================ rendering */
const doc = (bodies, css, title, lang) => `<!doctype html><html lang="${lang}"><head><meta charset="utf-8"><title>${title}</title>` +
  `<link rel="stylesheet" href="${FONT_CSS}"><style>${css}${PRINT_CSS}</style></head><body>${bodies.join("")}</body></html>`;
const stem = () => `Worksheet_${levelTag(state.level)}_${state.seed}_${state.lang}`;

function translateUI() {
  document.documentElement.lang = state.ui;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  $("prev").setAttribute("aria-label", t("prev")); $("next").setAttribute("aria-label", t("next"));
  renderPanel(); renderTitle(); renderRecent(); updateFeedbackLinks(); renderThanks(); if (state.sheet) renderTools();
  if (backend) loadCatalog().then(renderPanel);
  if (state.sheet) renderView();
}
function fillLangSelects() {
  for (const [id, key] of [["ui-lang", "ui"], ["lang", "lang"], ["alang", "alang"]]) {
    $(id).innerHTML = Object.entries(LANGS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
    $(id).value = state[key];
    $(id).onchange = () => {
      state[key] = $(id).value; localStorage[key] = state[key];
      if (key === "ui") translateUI(); else update();
    };
  }
}
/* ---------- year -> subject -> what to practise (ready-made sheet or chosen topics) */
const catalogs = {};  // UI language -> topic catalogue from scripts/topics.py
const catalog = () => catalogs[state.ui];
async function loadCatalog() {
  if (!catalogs[state.ui]) {
    catalogs[state.ui] = await backend.catalog(state.ui);
    if (state.sheet) renderTools();  // "a bit harder" needs the catalogue
  }
  return catalogs[state.ui];
}
function topicYear(id) {
  for (const c of Object.values(catalogs)) for (const r of c.rows) if (r.variants.some((v) => v.id === id)) return r.year;
  return id[0] === "r" ? "R" : id[0] === "y" ? "Y1" : null;
}
// ready-made sheets: [{id: level, key: label, part: 1 | 2 | null}] (Year 1 review comes in two parts of 9 tasks)
const FALLBACK_PRESETS = { R: [{ id: "R", key: "R", part: null }], Y1: [{ id: "Y1A", key: "Y1A", part: null }], Y2: [] };
const presetsFor = (y) => (catalog() ? catalog().presets[y] : FALLBACK_PRESETS[y]);
const presetIds = (y) => presetsFor(y).map((p) => p.id);
const selMap = () => state.sel[state.year] || (state.sel[state.year] = new Map());
function topicSpec() {
  const m = selMap(), ids = [];
  for (const r of (catalog() ? catalog().rows : [])) if (r.year === state.year && m.has(r.row)) ids.push(m.get(r.row));
  return ids.length ? `T:${ids.join("_")}` : null;
}
function syncFromLevel() {  // after a link or a "recent" chip: show the panel that matches state.level
  if (typeof state.level === "number" && catalog()) {  // old links #L2-123: part 1 of that review level
    const p = presetsFor("Y1").find((x) => x.key === String(state.level) && x.part === 1);
    if (p) state.level = p.id;
  }
  state.year = yearOfLevel(state.level);
  const preset = presetIds(state.year).includes(state.level);
  state.mode = isTopics(state.level) && !preset ? "topics" : "ready";
  if (state.mode === "ready") state.lastPreset[state.year] = state.level;
  else if (catalog()) {
    const m = new Map(), ids = state.level.slice(2).split("_");
    for (const r of catalog().rows) for (const v of r.variants) if (ids.includes(v.id)) m.set(r.row, v.id);
    state.sel[state.year] = m;
  }
}
function renderPanel() {
  const u = UI[state.ui];
  const card = (attr, id, big, name, text, on) => `
    <button type="button" class="level" role="radio" aria-checked="${on}" ${attr}="${id}">
      <span class="big">${big}</span><span><b>${name}</b><small>${text}</small></span></button>`;
  $("years").innerHTML = ["R", "Y1", "Y2"].map((y) => card("data-year", y, y === "R" ? "R" : y.slice(1), ...u.years[y], y === state.year)).join("");
  $("subjects").innerHTML = `<button class="chip" aria-pressed="true">${u.maths}</button>` +
    [u.english, u.science].map((n) => `<button class="chip" disabled>${n} · ${u.soon}</button>`).join("");
  $("modes").innerHTML = [["ready", u.ready], ["topics", u.choose]].map(([m, n]) =>
    `<button class="chip" role="radio" aria-pressed="${state.mode === m}" data-mode="${m}">${n}</button>`).join("");
  const desc = { R: u.stages.R[1], Y1A: u.stages.Y1A[1], 1: u.levels[0][1], 2: u.levels[1][1], 3: u.levels[2][1], Y2: u.years.Y2[1] };
  $("presets").hidden = state.mode !== "ready";
  $("presets").innerHTML = presetsFor(state.year).map((p) => {
    const big = { R: "R", Y1A: "A", Y2: "★" }[p.key] || p.key;
    const name = u.presetNames[p.key] + (p.part ? ` · ${u.partWord} ${p.part}` : "");
    return card("data-preset", p.id, big, name, desc[p.key], p.id === state.level);
  }).join("");
  $("topic-picker").hidden = state.mode !== "topics";
  if (state.mode === "topics") renderTopics();
}
function renderTopics() {
  const c = catalog();
  if (!c) { $("topic-list").innerHTML = ""; return; }
  const m = selMap(), u = UI[state.ui];
  $("topic-count").textContent = fmt(u.topicsCount, { n: m.size, max: c.max });
  let html = "", strand = null;
  for (const r of c.rows.filter((r) => r.year === state.year)) {
    if (r.strand !== strand) { strand = r.strand; html += `<p class="strand">${c.strands[strand]}</p>`; }
    const on = m.has(r.row), chosen = r.variants.find((v) => v.id === m.get(r.row)) || r.variants[Math.floor(r.variants.length / 2)];
    const chips = r.variants.length > 1 ? `<div class="vchips">${r.variants.map((v) =>
      `<button class="chip" data-row="${r.row}" data-var="${v.id}" aria-pressed="${on && v.id === chosen.id}">${v.label}</button>`).join("")}</div>` : "";
    html += `<div class="trow"><button type="button" class="pick" role="checkbox" aria-checked="${on}" data-row="${r.row}">
      <span class="tickbox">${on ? "✓" : ""}</span><span>${r.title}</span><span class="ptag">${c.periods[chosen.period]}</span></button>${chips}</div>`;
  }

}
function setYear(y) {
  state.year = y; state.mode = "ready";
  state.level = state.lastPreset[y] ?? presetIds(y)[0] ?? null;
  renderPanel(); update();
}
function setMode(m) {
  state.mode = m;
  state.level = m === "ready" ? (state.lastPreset[state.year] ?? presetIds(state.year)[0]) : topicSpec();
  renderPanel(); update();
}
$("years").addEventListener("click", (e) => { const b = e.target.closest("[data-year]"); if (b) setYear(b.dataset.year); });
$("modes").addEventListener("click", (e) => { const b = e.target.closest("[data-mode]"); if (b) setMode(b.dataset.mode); });
$("presets").addEventListener("click", (e) => {
  const b = e.target.closest("[data-preset]"); if (!b) return;
  state.level = parseLevel(b.dataset.preset); state.lastPreset[state.year] = state.level; localStorage.level = state.level;
  renderPanel(); update();
});
let topicTimer;
$("topic-list").addEventListener("click", (e) => {
  const b = e.target.closest("[data-row]"); if (!b) return;
  const m = selMap(), row = b.dataset.row, c = catalog();
  if (b.dataset.var) m.set(row, b.dataset.var);
  else if (m.has(row)) m.delete(row);
  else {
    if (m.size >= c.max) return toast(fmt(UI[state.ui].topicsCount, { n: m.size, max: c.max }));
    const r = c.rows.find((x) => x.row === row);
    m.set(row, r.variants[Math.floor(r.variants.length / 2)].id);
  }
  state.level = topicSpec();
  renderTopics();
  clearTimeout(topicTimer); topicTimer = setTimeout(update, 250);  // ticking several topics quickly builds once
});

function setSeed(s) { state.seed = Math.min(MAX_SEED, Math.max(0, s)); $("seed").value = state.seed; update(); }
$("prev").onclick = () => setSeed(state.seed - 1);
$("next").onclick = () => setSeed(state.seed + 1);
$("random").onclick = () => setSeed(randomSeed());
let typing;
$("seed").addEventListener("input", () => {
  clearTimeout(typing);
  typing = setTimeout(() => { const v = $("seed").value.trim(); if (/^\d{1,6}$/.test(v)) { state.seed = +v; update(); } }, 300);
});
$("seed").addEventListener("blur", () => { $("seed").value = state.seed; });
$("tabs").addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (b) { state.tab = b.dataset.tab; renderView(); } });

function renderTitle() {
  if (isTopics(state.level) || state.level === null) {
    const title = t("stageTitle", { stage: `${UI[state.ui].years[state.year][0]} · ${t("topicsShort")}`, seed: state.seed });
    $("title").textContent = title; document.title = `${title} — Let's Practice!`;
    return;
  }
  const stage = isStage(state.level) ? UI[state.ui].stages[state.level][0] : null;
  const title = stage ? t("stageTitle", { stage, seed: state.seed }) : t("title", state);
  $("title").textContent = title;
  document.title = stage ? `${title} — Let's Practice!` : t("docTitle", state);
}

let buildNo = 0;
async function update() {
  writeHash();
  $("seed").value = state.seed;
  ["lang", "alang"].forEach((k) => { $(k).value = state[k]; });
  renderTitle();
  if (!backend) return;
  if (state.level === null) {  // "choose topics" with nothing ticked yet
    state.sheet = null; ++buildNo;
    ["print-sheet", "print-answers", "pdf-sheet", "pdf-answers", "print-cheats"].forEach((id) => { $(id).disabled = true; });
    $("cheat-block").hidden = $("tab-cheats").hidden = true;
    $("view").innerHTML = `<div class="loading"></div>`; $("view").firstChild.textContent = t("topicsNone");
    return;
  }
  const no = ++buildNo;
  try {
    const sheet = await backend.build(state.level, state.seed, state.lang, state.alang);
    if (no !== buildNo) return;  // a newer request has started meanwhile
    state.sheet = sheet;
  } catch (err) {
    console.error(err);
    $("view").innerHTML = `<div class="loading"></div>`;
    $("view").firstChild.textContent = `${t("buildFail")} ${String(err.message || err).split("\n").slice(-2).join(" ")}`;
    return;
  }
  ["print-sheet", "print-answers", "pdf-sheet", "pdf-answers", "print-cheats"].forEach((id) => { $(id).disabled = false; });
  remember();
  await refreshCheats();
  renderView();
}

/* ================================================================ cheat sheets (Reception, Year 1 autumn and topic sheets) */
const cheatTitles = {};  // "level|lang" -> [[task number on the sheet, card title], ...]
const picksFor = {};     // level -> Set of ticked task numbers (all by default)
const picks = () => picksFor[state.level] || (picksFor[state.level] = new Set(
  (cheatTitles[`${state.level}|${state.lang}`] || []).map(([n]) => n)));
async function refreshCheats() {
  let titles = [];
  if (isStage(state.level)) {
    const key = `${state.level}|${state.lang}`;
    if (!cheatTitles[key]) cheatTitles[key] = await backend.cheatTitles(state.level, state.lang);
    titles = cheatTitles[key];
  }
  const on = titles.length > 0;
  $("cheat-block").hidden = $("tab-cheats").hidden = !on;
  if (!on) { if (state.tab === "cheats") state.tab = "sheet"; return; }
  renderPicks();
}
function renderPicks() {
  const titles = cheatTitles[`${state.level}|${state.lang}`] || [], sel = picks();
  $("cheat-picks").innerHTML = titles.map(([n, title]) => `
    <button type="button" class="pick" role="checkbox" aria-checked="${sel.has(n)}" data-pick="${n}">
      <span class="tickbox">${sel.has(n) ? "✓" : ""}</span><span class="no">${n}</span><span>${title}</span></button>`).join("");
}
$("cheat-picks").addEventListener("click", (e) => {
  const b = e.target.closest("[data-pick]"); if (!b) return;
  const n = +b.dataset.pick, sel = picks();
  sel.has(n) ? sel.delete(n) : sel.add(n);
  renderPicks(); if (state.tab === "cheats") renderView();
});
$("cheat-all").onclick = () => { delete picksFor[state.level]; picks(); renderPicks(); if (state.tab === "cheats") renderView(); };
$("cheat-none").onclick = () => { picksFor[state.level] = new Set(); renderPicks(); if (state.tab === "cheats") renderView(); };
async function cheatPages() {
  const which = [...picks()].sort((a, b) => a - b);
  if (!which.length) return null;
  return (await backend.cheats(state.level, state.seed, state.lang, which)).pages;
}
$("print-cheats").onclick = async () => {
  const pages = await cheatPages();
  if (!pages) return toast(t("cheatsNone"));
  printBodies(pages, `${stem()}_cheats`, state.lang);
};

const scalers = new ResizeObserver((entries) => {
  for (const e of entries) e.target.firstElementChild.style.transform = `scale(${e.contentRect.width / 794})`;
});
let viewNo = 0;
async function renderView() {
  if (!state.sheet) return;
  renderTools();
  $("tabs").querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.tab === state.tab));
  const no = ++viewNo;
  if (state.tab === "cheats") {
    const pages = await cheatPages();
    if (no !== viewNo) return;
    if (!pages) { $("view").innerHTML = `<div class="loading"></div>`; $("view").firstChild.textContent = t("cheatsNone"); return; }
    return showPages(pages, (i) => t("page", { n: i + 1 }), state.lang);
  }
  const isSheet = state.tab === "sheet";
  showPages(isSheet ? state.sheet.pages : state.sheet.answers.split(/(?=<div class="page")/),
            (i) => (isSheet ? t("page", { n: i + 1 }) : t("answersFor")), isSheet ? state.lang : state.alang);
}
function showPages(bodies, labelOf, lang) {
  const wrap = document.createElement("div");
  wrap.className = "pages" + (bodies.length === 1 ? " single" : "");
  bodies.forEach((body, i) => {
    const cell = document.createElement("div");
    const label = document.createElement("p"); label.className = "pno";
    label.textContent = labelOf(i);
    const pg = document.createElement("div"); pg.className = "pg";
    const fr = document.createElement("iframe"); fr.title = label.textContent; fr.loading = "lazy";
    fr.srcdoc = doc([body], state.sheet.css, stem(), lang);
    fr.addEventListener("load", () => paintCream(fr));
    pg.appendChild(fr); cell.append(label, pg); wrap.appendChild(cell);
  });
  scalers.disconnect();
  $("view").replaceChildren(wrap);
  wrap.querySelectorAll(".pg").forEach((p) => scalers.observe(p));
}

/* ================================================================ screen tools: listen, cream, a bit harder */
const CREAM = "#fbf6e6";
state.cream = localStorage.cream === "1";
function paintCream(fr) {
  try {
    const d = fr.contentDocument; let st = d.getElementById("cream-style");
    if (!st) { st = d.createElement("style"); st.id = "cream-style"; d.head.appendChild(st); }
    st.textContent = state.cream ? `html,body,.page{background:${CREAM} !important}` : "";
  } catch { /* not ready yet */ }
}
$("cream").addEventListener("click", () => {
  state.cream = !state.cream; localStorage.cream = state.cream ? "1" : "0";
  $("cream").setAttribute("aria-pressed", state.cream);
  document.querySelectorAll(".pg iframe").forEach(paintCream);
  document.querySelectorAll(".pg").forEach((p) => { p.style.background = state.cream ? CREAM : "#fff"; });
});

// read the task instructions aloud with the browser's own voices: nothing is sent anywhere
const VOICE_LANG = { en: "en-GB", uk: "uk-UA", ru: "ru-RU", el: "el-GR", de: "de-DE", fr: "fr-FR", es: "es-ES" };
const SPEAKER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const hasSpeech = "speechSynthesis" in window;
function voiceFor(lang) {
  const all = speechSynthesis.getVoices(), want = VOICE_LANG[lang];
  const norm = (v) => v.lang.replace("_", "-").toLowerCase();
  return all.find((v) => norm(v) === want.toLowerCase()) || all.find((v) => norm(v).startsWith(lang));
}
function taskTexts(bodies) {
  const out = [];
  for (const body of bodies) {
    const d = new DOMParser().parseFromString(body, "text/html");
    d.querySelectorAll(".q, .ih").forEach((h) => {
      const n = h.querySelector(".n")?.textContent.trim(), tx = h.querySelector(".qt, .it")?.textContent.trim();
      if (n && tx) out.push([n, tx]);
    });
  }
  return out;
}
function speak(text, lang) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = VOICE_LANG[lang]; u.rate = 0.85;
  const v = voiceFor(lang); if (v) u.voice = v;
  speechSynthesis.speak(u);
}
function renderListen() {
  const show = hasSpeech && state.sheet && state.tab === "sheet";
  $("listen").hidden = !show;
  if (!show) return;
  const voices = speechSynthesis.getVoices();
  if (voices.length && !voiceFor(state.lang)) {
    $("listen-btns").textContent = t("noVoice"); return;
  }
  $("listen-btns").innerHTML = taskTexts(state.sheet.pages).map(([n, tx], i) =>
    `<button class="chip" type="button" data-say="${i}" aria-label="${t("listen")} ${n}">${SPEAKER}${n}</button>`).join("");
  $("listen-btns").dataset.texts = JSON.stringify(taskTexts(state.sheet.pages).map((x) => x[1]));
}
if (hasSpeech) speechSynthesis.addEventListener?.("voiceschanged", renderListen);
$("listen-btns").addEventListener("click", (e) => {
  const b = e.target.closest("[data-say]"); if (!b) return;
  speak(JSON.parse($("listen-btns").dataset.texts)[+b.dataset.say], state.lang);
});

// "Next: a bit harder" (STANDARDS D8): the next ready-made sheet, or the same topics one level up
function harderLevel(level) {
  if (!catalog()) return null;
  const chain = ["R", "Y1", "Y2"].flatMap((y) => presetIds(y));
  const i = chain.indexOf(level);
  if (i >= 0) return chain[i + 1] ?? null;
  if (typeof level !== "string" || !level.startsWith("T:")) return null;
  const up = level.replace(/v(\d+)([ab])/g, (m, n, l) => `v${n}${l === "a" ? "b" : "c"}`);
  return up !== level ? up : null;
}
function renderTools() {
  $("tools").hidden = !state.sheet;
  $("cream").setAttribute("aria-pressed", state.cream);
  const next = state.sheet ? harderLevel(state.level) : null;
  $("harder").hidden = !next;
  $("harder").textContent = t("harder") + " →";
  renderListen();
}
$("harder").addEventListener("click", () => {
  const next = harderLevel(state.level); if (!next) return;
  state.level = next; syncFromLevel(); renderPanel(); update();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

/* ================================================================ print, pdf, link */
async function printBodies(bodies, title, lang) {
  const f = $("printframe");
  await new Promise((ok) => { f.onload = ok; f.srcdoc = doc(bodies, state.sheet.css, title, lang); });
  await f.contentDocument.fonts.ready;
  const old = document.title; document.title = title;  // some browsers name the PDF after the top page
  f.contentWindow.focus(); f.contentWindow.print();
  setTimeout(() => { document.title = old; }, 1000);
}
$("print-sheet").onclick = () => printBodies(state.sheet.pages, stem(), state.lang);
$("print-answers").onclick = () => printBodies([state.sheet.answers], `${stem()}_answers_${state.alang}`, state.alang);

async function downloadPdf(which) {
  toast(t("making"));
  try {
    const r = await fetch("api/pdf", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ level: state.level, seed: state.seed, lang: state.lang, alang: state.alang }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    const a = document.createElement("a");
    a.href = `out/${encodeURIComponent(data[which])}?download=1`; a.download = data[which];
    document.body.appendChild(a); a.click(); a.remove();
    document.querySelector(".toast")?.remove();
  } catch (err) { console.error(err); toast(t("pdfFail")); }
}
$("pdf-sheet").onclick = () => downloadPdf("pdf");
$("pdf-answers").onclick = () => downloadPdf("answers_pdf");
$("copy-link").onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); toast(t("copied")); } catch { toast(location.href); }
};

/* ================================================================ feedback (GitHub issues) */
const REPO = "https://github.com/ISergey256/lets-practice-worksheets";
function updateFeedbackLinks() {
  $("suggest").href = `${REPO}/issues/new?template=idea.md`;
  const body = `**Link to the worksheet:** ${location.href}\n\n**Which task and what is wrong?**\n\n\n**What should it be?**\n\n` +
    `<!-- Please do not attach photos of children or worksheets with a child's name. -->`;
  $("report").href = `${REPO}/issues/new?labels=bug&title=${encodeURIComponent("Problem: ")}&body=${encodeURIComponent(body)}`;
  $("why-link").href = `${REPO}/blob/main/${["ru", "uk"].includes(state.ui) ? "DESIGN.ru.md" : "DESIGN.md"}`;
}

/* ================================================================ contributors (site/contributors.json) */
let contributors = [];
fetch("contributors.json", { cache: "no-cache" }).then((r) => r.json()).then((d) => { contributors = d.people || []; renderThanks(); })
  .catch(() => {});
function renderThanks() {
  $("thanks").hidden = !contributors.length;
  const roles = UI[state.ui].roles, el = $("thanks-list");
  el.replaceChildren(...contributors.flatMap((c, i) => {
    const name = c.github ? Object.assign(document.createElement("a"), { href: `https://github.com/${c.github}`, textContent: c.name })
      : Object.assign(document.createElement("b"), { textContent: c.name });
    return [...(i ? [document.createTextNode(" · ")] : []), name,
      document.createTextNode(` — ${(c.roles || []).map((r) => roles[r] || r).join(", ")}`)];
  }));
}

/* ================================================================ recent */
function recentList() { try { return JSON.parse(localStorage.recent2 || "[]"); } catch { return []; } }
function remember() {
  if (state.level === null) return;
  const cur = [state.level, state.seed, state.lang, state.alang];
  const list = [cur, ...recentList().filter((x) => x.join() !== cur.join())].slice(0, 10);
  localStorage.recent2 = JSON.stringify(list);
  renderRecent();
}
function renderRecent() {
  const list = recentList(), cur = [state.level, state.seed, state.lang, state.alang].join();
  $("recent-block").hidden = list.length < 2;
  $("recent").innerHTML = list.map((x) => {
    const langs = x[2] === "en" && x[3] === "en" ? "" : ` · ${x[2]}/${x[3]}`;
    const lv = parseLevel(x[0]);
    const label = isTopics(lv) ? `${t("topicsShort")} · ${x[1]}` : isStage(lv) ? `${lv === "Y1A" ? "Y1" : lv} · ${x[1]}`
      : t("short", { level: x[0], seed: x[1] });
    return `<button class="chip" data-r="${x.join()}" aria-pressed="${x.join() === cur}">${label}${langs}</button>`;
  }).join("");
}
$("recent").addEventListener("click", (e) => {
  const b = e.target.closest("[data-r]"); if (!b) return;
  const [l, s, lang, alang] = b.dataset.r.split(",");
  Object.assign(state, { level: parseLevel(l) || 2, lang: pick(lang, "en"), alang: pick(alang, "en") });
  syncFromLevel(); renderPanel(); setSeed(+s);
});

let toastTimer;
function toast(msg) {
  document.querySelector(".toast")?.remove(); clearTimeout(toastTimer);
  const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = msg;
  document.body.appendChild(el); toastTimer = setTimeout(() => el.remove(), 3500);
}

/* ================================================================ start */
window.addEventListener("hashchange", () => { if (readHash()) { syncFromLevel(); renderPanel(); update(); } });
if (!readHash()) { state.level = parseLevel(localStorage.level) || "Y1A"; state.seed = randomSeed(); }
state.year = yearOfLevel(state.level);
fillLangSelects(); translateUI(); update();
localBackend().catch(() => pyodideBackend()).then(async (b) => {
  backend = b;
  $("pdf-sheet").hidden = $("pdf-answers").hidden = !b.pdf;
  await loadCatalog();
  syncFromLevel(); renderPanel();
  update();
}).catch((err) => {
  console.error(err);
  $("view").innerHTML = `<div class="loading"></div>`;
  $("view").firstChild.textContent = t("loadFail");
});
</script>
</body>
